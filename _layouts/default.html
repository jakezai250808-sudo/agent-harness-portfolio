<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}">Posts</a>
          <a href="{{ '/docs/architecture.html' | relative_url }}">Architecture</a>
          <a href="{{ '/cases/failure-cases.html' | relative_url }}">Cases</a>
          <a href="{{ '/docs/benchmark.html' | relative_url }}">Benchmark</a>
          <a href="{{ site.github.repository_url | default: 'https://github.com/jakezai250808-sudo/agent-harness-portfolio' }}">GitHub</a>
        </nav>
      </div>
    </header>

    <main class="container page">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>Agent Harness / Runtime Infra / Interview Evidence</p>
      </div>
    </footer>
  </body>
</html>
